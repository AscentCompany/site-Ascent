<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascent | Perfil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lilita+One&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
    <link rel="stylesheet" href="../css/perfil.css">
    <script src="../js/sidebarNav.js" defer></script>
</head>
<body>
  <script src="../js/sessao.js"></script>
  <script>validarSessao();</script>

<div class="app">

    <!-- BOTÃO ABRIR/FECHAR MENU MOBILE -->
    <button class="btn-menu" id="btn-menu" aria-label="Abrir ou fechar menu">
      <i class="fi fi-rr-menu-burger"></i>
    </button>
    <div class="overlay" id="overlay"></div>

    <!-- SIDEBAR PADRÃO ASCENT -->
    <aside class="sidebar">
      <div class="logo">
        <a href="./acessoRapido.html"><img src="../assets/icon/logo2.png" alt="Ascent"></a>      
      </div>

      <div class="profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
        <span id="nome-usuario"></span>
      </div>

      <nav class="nav">
        <span class="nav-indicador" id="nav-indicador"></span>
        <div class="nav-item"><a href="./dashboardRotas.html">Dashboard - rotas</a></div>
        <div class="nav-item "><a href="./dashboardOperacoes.html">Dashboard - operações</a></div>
        <div class="nav-item"><a href="../usuarios.html">Gestão</a></div>
        <div class="nav-item"><a href="./centralAlertas.html">Central de Alertas</a></div>
        <div class="nav-item"><a href="./centralRecomendacoes.html">Central de Recomendações</a></div>
        <div class="nav-item" id="nav-configurar-perfil" style="display:none;"><a href="./configurarAlertas.html">Configurar Alertas</a></div>
        <div class="nav-item ativo"><a href="./perfil.html">Perfil</a></div>
        <div class="nav-item"><a href="./faq.html">FAQ</a></div>
      </nav>

      <button class="logout" type="button" onclick="limparSessao()">SAIR</button>
    </aside>

    <!-- CONTEÚDO PRINCIPAL - PERFIL -->
    <main class="main-content">
      <div class="perfil-container">

        <!-- Banner Superior do Perfil -->
        <div class="perfil-banner">
          <div class="perfil-avatar-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
            </svg>
          </div>
          <div class="perfil-info-user">
            <h2 id="nomeUsuarioBanner"></h2>
          </div>
        </div>

        <!-- Caixa de Alterar Perfil -->
        <div class="perfil-card-form">
          <h1 class="titulo-alterar">ALTERAR PERFIL</h1>

          <form class="form-grid" id="form-perfil">
            
            <div class="input-group full-width">
              <label for="nomeCompleto">Nome completo</label>
              <input type="text" id="nomeCompleto" placeholder="Nome completo" readonly>
            </div>

            <div class="input-group full-width">
              <label for="email">Email</label>
              <input type="email" id="email" placeholder="Email" readonly>
            </div>

            <div class="input-group full-width">
              <label for="senhaAtual">Senha atual</label>
              <input type="password" id="senhaAtual" placeholder="Senha atual">
            </div>

            <div class="input-group half-width">
              <label for="novaSenha">Nova senha</label>
              <input type="password" id="novaSenha" placeholder="Nova senha">
            </div>

            <div class="input-group half-width">
              <label for="confirmaSenha">Confirmar nova senha</label>
              <input type="password" id="confirmaSenha" placeholder="Confirmar nova senha">
            </div>

            <div class="btn-container">
              <p id="msg-perfil" class="perfil-msg"></p>
              <button type="submit" class="btn-confirmar">Confirmar alteração</button>
            </div>

          </form>
        </div>

      </div>
    </main>

</div>

<script>
  // ---------- SIDEBAR E NOME DO USUÁRIO ----------
  document.getElementById('nome-usuario').textContent = sessionStorage.NOME_USUARIO || 'Usuário';

  const btnMenu = document.getElementById('btn-menu');
  const overlay = document.getElementById('overlay');
  if (window.innerWidth <= 900) document.body.classList.add('menu-fechado');

  if (btnMenu && overlay) {
    btnMenu.addEventListener('click', () => document.body.classList.toggle('menu-fechado'));
    overlay.addEventListener('click', () => document.body.classList.add('menu-fechado'));
  }

  // ---------- PERFIL: INTEGRAÇÃO COM A API ----------
  (function () {
  const idUsuario = sessionStorage.ID_USUARIO;
  const msgPerfil = document.getElementById('msg-perfil');

  function mostrarMensagem(texto, sucesso) {
    msgPerfil.textContent = texto;
    msgPerfil.className = 'perfil-msg ' + (sucesso ? 'sucesso' : 'erro');
  }

  // Nome e e-mail vêm direto do banco e não são editáveis
  function carregarPerfil() {
    fetch(`/perfil/${idUsuario}`)
      .then(res => res.json().then(dados => ({ ok: res.ok, dados })))
      .then(({ ok, dados }) => {
        if (!ok) return mostrarMensagem(dados.mensagem, false);
        document.getElementById('nomeCompleto').value = dados.nome;
        document.getElementById('email').value = dados.email;
        document.getElementById('nomeUsuarioBanner').textContent = dados.nome;
      })
      .catch(() => mostrarMensagem('Não foi possível carregar o perfil.', false));
  }

  // Única alteração permitida: a senha
  function alterarSenha(event) {
    event.preventDefault();

    const senhaAtual = document.getElementById('senhaAtual').value;
    const novaSenha = document.getElementById('novaSenha').value;
    const confirmaSenha = document.getElementById('confirmaSenha').value;

    if (!senhaAtual || !novaSenha || !confirmaSenha) {
      return mostrarMensagem('Preencha todos os campos de senha.', false);
    }
    if (novaSenha !== confirmaSenha) {
      return mostrarMensagem('A nova senha e a confirmação não coincidem.', false);
    }

    fetch('/perfil/senha', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ idUsuario, senhaAtual, novaSenha, confirmaSenha })
    })
      .then(res => res.json().then(dados => ({ ok: res.ok, dados })))
      .then(({ ok, dados }) => {
        mostrarMensagem(dados.mensagem, ok);
        if (ok) {
          document.getElementById('senhaAtual').value = '';
          document.getElementById('novaSenha').value = '';
          document.getElementById('confirmaSenha').value = '';
        }
      })
      .catch(() => mostrarMensagem('Erro de comunicação com o servidor.', false));
  }

  document.getElementById('form-perfil').addEventListener('submit', alterarSenha);
  carregarPerfil();
  })();
</script>

</body>
</html>
