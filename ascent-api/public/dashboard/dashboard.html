<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ascent – Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <img src="/site-Ascent/ascent-api/public/assets/icon/logo2.png" alt="Ascent">
    </div>

    <nav class="nav">
      <a href="#" class="active">Dashboard</a>
      <a href="#">Ascent IA</a>
      <a href="#">Perfil</a>
      <a href="#">FAQ</a>
    </nav>

    <button class="logout" type="button">SAIR</button>
  </aside>

  <!-- CONTEÚDO -->
  <main class="main">

    <section class="kpis">
      <article class="card kpi-gradient kpi-region">
        <h2>titulo</h2>
        <div class="big">.</div>
        <div class="sub">.</div>
        <div class="year">.</div>
      </article>

      <article class="card kpi-middle">
        <div>
          <h3>titulo</h3>
          <div class="kpi-box">
            <div class="value">.</div>
            <div class="label">.</div>
            <div class="prev">.</div>
            <div class="goal">.</div>
          </div>
        </div>
        <div>
          <h3>titulo</h3>
          <div class="kpi-box">
            <div class="value">.</div>
            <div class="label">.</div>
            <div class="prev">.</div>
            <div class="goal">.</div>
          </div>
        </div>
      </article>

      <article class="card kpi-gradient kpi-variation">
        <h2>titulo</h2>
        <div class="big">.</div>
        <div class="sub">.</div>
        <div class="prev">.</div>
      </article>
    </section>

    <section class="card card-evolucao">
      <h2 class="chart-title">titulo</h2>
      <div class="chart-placeholder" id="grafico-evolucao">Gráfico</div>
    </section>

    <section class="card card-mensal">
      <h2 class="chart-title">titulo</h2>
      <div class="chart-placeholder" id="grafico-mensal">Gráfico</div>
    </section>

    <section class="card card-faixa">
      <h2 class="chart-title">titulo</h2>
      <div class="chart-placeholder" id="grafico-faixa">Gráfico</div>
    </section>

  </main>
</div>
</body>
</html>
