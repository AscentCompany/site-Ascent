<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ascent – Acesso Rápido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lilita+One&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
  <link rel="stylesheet" href="../css/acessoRapido.css">
</head>
<body>
  <div class="app">

    <!-- BOTÃO ABRIR/FECHAR MENU -->
    <button class="btn-menu" id="btn-menu" aria-label="Abrir ou fechar menu">
      <i class="fi fi-rr-menu-burger"></i>
    </button>
    <div class="overlay" id="overlay"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="logo">
        <a href="./acessoRapido.html"><img src="../assets/icon/logo2.png" alt="Ascent"></a>
      </div>

      <div class="profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
        <span id="nome-usuario"></span>
      </div>

      <nav class="nav">
        <span class="nav-indicador" id="nav-indicador"></span>
        <div class="nav-item"><a href="./dashboardRotas.html">Dashboard - rotas</a></div>
        <div class="nav-item"><a href="./dashboardOperacoes.html">Dashboard - operações</a></div>
        <div class="nav-item"><a href="../usuarios.html">Gestão</a></div>
        <div class="nav-item"><a href="./centralAlertas.html">Central de Alertas</a></div>
        <div class="nav-item" id="nav-configurar-ar" style="display:none;"><a href="./configurarAlertas.html">Configurar Alertas</a></div>
        <div class="nav-item"><a href="#">Ascent IA</a></div>
        <div class="nav-item"><a href="./perfil.html">Perfil</a></div>
        <div class="nav-item"><a href="./faq.html">FAQ</a></div>
      </nav>

      <button class="logout" type="button"><a href="../index.html" style="color: inherit; text-decoration: none;">SAIR</a></button>
    </aside>

    <!-- CONTEÚDO PRINCIPAL - ACESSO RÁPIDO -->
    <main class="main">
      <div class="acesso-container">
        
        <header class="acesso-header">
          <h1>ACESSO RÁPIDO</h1>
          <img src="../assets/icon/logo3.png" alt="Ascent" class="logo-topo">
        </header>

        <section class="acesso-grid">
          <a href="./dashboardRotas.html" class="card-acesso branco">
            <span>Dashboard<br>Rotas</span>
          </a>

          <a href="./dashboardOperacoes.html" class="card-acesso laranja">
            <span>Dashboard<br>Operações</span>
          </a>

          <a href="./perfil.html" class="card-acesso branco">
            <span>Perfil</span>
          </a>

          <a href="../usuarios.html" class="card-acesso laranja">
            <span>Gestão de<br>funcionários</span>
          </a>

          <a href="./faq.html" class="card-acesso branco">
            <span>FAQ</span>
          </a>

          <a href="./centralAlertas.html" class="card-acesso laranja">
            <span>Central de<br>Alertas</span>
          </a>
        </section>

      </div>
    </main>

  </div>

  <script>

    document.getElementById('nome-usuario').textContent = sessionStorage.NOME_USUARIO || 'Usuário';

    const btnMenu = document.getElementById('btn-menu');
    const overlay = document.getElementById('overlay');
    if(window.innerWidth <= 900) document.body.classList.add('menu-fechado');
    btnMenu.addEventListener('click', () => document.body.classList.toggle('menu-fechado'));
    overlay.addEventListener('click', () => document.body.classList.add('menu-fechado'));
    const itensNav = [...document.querySelectorAll('.sidebar .nav-item')];
    const indicador = document.getElementById('nav-indicador');
    const indiceAtivo = () => itensNav.findIndex(i => i.classList.contains('ativo'));
    const topoDe = i => `translateY(${itensNav[i].offsetTop}px)`;
    function posicionarIndicador(){
      const atual = indiceAtivo();
      if(atual < 0) return;
      const guardado = sessionStorage.getItem('navAnterior');
      const ant = guardado === null ? atual : Number(guardado);
      sessionStorage.removeItem('navAnterior');
      indicador.style.transition = 'none';
      indicador.style.transform = topoDe(itensNav[ant] ? ant : atual);
      indicador.style.opacity = 1;
      indicador.offsetHeight;
      indicador.style.transition = '';
      indicador.style.transform = topoDe(atual);
    }
    window.addEventListener('load', posicionarIndicador);
    window.addEventListener('resize', () => {
      const atual = indiceAtivo();
      if(atual < 0) return;
      indicador.style.transition = 'none';
      indicador.style.transform = topoDe(atual);
    });
    itensNav.forEach(item => {
      item.addEventListener('click', () => {
        if(item.classList.contains('ativo')) return;
        if(item.querySelector('a')) sessionStorage.setItem('navAnterior', indiceAtivo());
      });
    });

    // Mostrar itens de gestor
    if (Number(sessionStorage.CARGO_USUARIO) <= 2) {
      var navConf = document.getElementById('nav-configurar-ar');
      var cardConf = document.getElementById('card-configurar-ar');
      if (navConf)  navConf.style.display  = '';
      if (cardConf) cardConf.style.display = '';
    }

  </script>
</body>
</html>
