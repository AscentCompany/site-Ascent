<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascent | Gerenciar Cargos</title>
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/users.css">

</head>
<body>

<div class="modal-overlay" id="modalCadastro">
    <div class="modal-content formulario">
        <span class="fechar-modal" onclick="fecharModal()">X</span>
        <h2 class="titulo-boas-vindas" style="font-size: 24px;">Novo Cargo</h2>

        <label for="modalNomeCargo">Nome do Cargo</label>
        <input type="text" id="modalNomeCargo" placeholder="Nome do Cargo">

        <label for="modalCargo">Permissões</label>
        <select id="modalCargo">
        </select>

        <button class="botao-enviar" onclick="criarNovoCargo()">Criar Cargo</button>
    </div>
</div>

<div class="page-wrapper">

    <div class="sidebar">
        <div class="logo-container">
            <a href="index.html">
                <img src="assets/icon/logo.png" alt="Logo da Ascent" />
            </a>
        </div>
        <nav class="sidebar-menu">
            <button class="menu-btn" onclick="window.location.href='usuarios.html'">Gerenciar Organização</button>
            <button class="menu-btn active" onclick="window.location.href='usuarios.html'">Gerenciar Cargos</button>
            <button class="menu-btn" onclick="window.location.href='usuarios.html'">Gerenciar Funcionalidades</button>
        </nav>
    </div>

    <main class="container-gerenciar">

        <div class="header-gerenciar">
            <div class="titulos">
                <h1 class="titulo-boas-vindas">Gerenciar Cargos</h1>
                <span class="subtitulo">*Gerenciar cargos e suas permissões</span>
            </div>
            <button class="btn-novo-usuario" onclick="abrirModal()">+ Novo Cargo</button>
        </div>

        <div class="cartao-gerenciar">

            <div class="tabela-cabecalho">
                <div class="col-nome">Cargo</div>
                <div class="col-email">Permissões</div>
                <div class="col-acoes">Ações</div>
            </div>

            <div id="listaCargos">
                <!--vazio aqui pq preenche com o js-->
            </div>

        </div>
    </main>
</div>

<script>

    let idCompanhia = Number(sessionStorage.COMPANHIA_USUARIO);

    function abrirModal() {
        document.getElementById("modalCadastro").style.display = "flex";
    }

    function fecharModal() {
        document.getElementById("modalCadastro").style.display = "none";
        modalNome.value = "";
        modalEmail.value = "";
        modalSenha.value = "";
    }

    function listarCargos() {
        fetch(`/cargos/cargos/${idCompanhia}`)
            .then(res => res.json())
            .then(linhasBd => {
                let lista = document.getElementById("listaCargos");
                lista.innerHTML = "";

                let cargosAgrupados = [];
                let ultimoIdVisto = -1;
                let indexAtual = -1;

                for (let i = 0; i < linhasBd.length; i++) {
                    let linha = linhasBd[i];

                    if (linha.idCargo !== ultimoIdVisto) {
                        indexAtual++;
                        cargosAgrupados[indexAtual] = {
                            idCargo: linha.idCargo,
                            cargo: linha.cargo,
                            permissoes: ""
                        };
                        ultimoIdVisto = linha.idCargo;
                    }

                    let estaMarcado = "";
                    if (linha.idCargoPermissao !== null) {
                        estaMarcado = "checked";
                    }

                    let permissaoBloco = `
                        <label style="display: flex; align-items: center; cursor: pointer; white-space: nowrap;">
                            <input type="checkbox" ${estaMarcado} style="margin-right: 5px;">
                            <span>${linha.permissao}</span>
                        </label>
                    `;

                    cargosAgrupados[indexAtual].permissoes += permissaoBloco;
                }

                for (let i = 0; i < cargosAgrupados.length; i++) {
                    let c = cargosAgrupados[i];

                    let textoPermissoes = c.permissoes;
                    if (textoPermissoes === "") {
                        textoPermissoes = "Nenhuma permissão vinculada";
                    }

                    lista.innerHTML += `
                        <div class="linha-usuario" id="linha_cargo_${c.idCargo}">
                            <div class="col-nome" style="color: var(--cinza-texto); font-weight: 600; font-size: 16px;">
                                ${c.cargo}
                            </div>
                            <div class="col-email" style="color: var(--cinza-texto); font-size: 14px;">
                                ${textoPermissoes}
                            </div>
                            <div class="col-acoes acoes-botoes">
                                <button class="btn-acao" onclick="abrirModalEdicao(${c.idCargo})">Editar</button>
                                <button class="btn-acao" onclick="excluirCargo(${c.idCargo})">Excluir</button>
                            </div>
                        </div>
                    `;
                }
            })
            .catch(erro => {
                console.error("Erro ao carregar cargos:", erro);
            });
    }


        listarCargos();

</script>

</body>
</html>
