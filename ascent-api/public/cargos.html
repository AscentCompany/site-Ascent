<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascent | Gerenciar Cargos</title>
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/cruds.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lilita+One&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
    <link rel="stylesheet" href="css/dashboardOperacoes.css">
    <script src="js/sidebarNav.js" defer></script>

</head>
<body>
    <script src="js/sessao.js"></script>
    <script>validarSessao();</script>
    <script>
        const sidebarState = sessionStorage.getItem("gestaoSidebarState");
        if (sidebarState !== null) {
            sessionStorage.removeItem("gestaoSidebarState");
            document.body.classList.toggle("menu-fechado", sidebarState === "closed");
        } else if (window.innerWidth <= 900) {
            document.body.classList.add("menu-fechado");
        }
    </script>
<div class="modal-overlay" id="modalCadastro" style="display: none;">
    <div class="modal-content formulario">
        <span class="fechar-modal" onclick="fecharModal()">X</span>
        <h2 class="titulo-boas-vindas" style="font-size: 24px;">Novo Cargo</h2>

        <label for="modalNomeCargo">Nome do Cargo</label>
        <input type="text" id="modalNomeCargo" placeholder="Nome do Cargo">

        <label for="modalCargo">Permissões</label>
        <div class="modal-input-group">
            <select id="modalCargo" class="modal-select-flex">
                <option value="">Selecione uma permissão...</option>
            </select>
            <button class="btn-acao" onclick="adicionarPermissaoNaLista()" style="height: auto;">Add</button>
        </div>

        <div id="listaPermissoesModal" class="modal-tags-container">
            <!-- preenchido pelo js -->
        </div>

        <button class="botao-enviar" onclick="criarNovoCargo()" style="margin-top: 25px;">Criar Cargo</button>
    </div>
</div>


<div class="app">
    <button class="btn-menu" id="btn-menu" aria-label="Abrir ou fechar menu">
        <i class="fi fi-rr-menu-burger"></i>
    </button>
    <div class="overlay" id="overlay"></div>
    <aside class="sidebar">
        <div class="logo">
            <a href="dashboard/acessoRapido.html"><img src="assets/icon/logo2.png" alt="Ascent"></a>
        </div>
        <div class="profile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
            <span id="nome-usuario"></span>
        </div>
        <nav class="nav">
            <span class="nav-indicador" id="nav-indicador"></span>
            <div class="nav-item"><a href="dashboard/dashboardRotas.html">Dashboard - rotas</a></div>
            <div class="nav-item"><a href="dashboard/dashboardOperacoes.html">Dashboard - operações</a></div>
            <div class="nav-item ativo"><a href="usuarios.html">Gestão</a></div>
            <div class="nav-item"><a href="dashboard/centralAlertas.html">Central de Alertas</a></div>
            <div class="nav-item" id="nav-configurar-gestao" style="display:none;"><a href="dashboard/configurarAlertas.html">Configurar Alertas</a></div>
            <div class="nav-item"><a href="dashboard/perfil.html">Perfil</a></div>
            <div class="nav-item"><a href="dashboard/faq.html">FAQ</a></div>
        </nav>
        <button class="logout" type="button" onclick="limparSessao()">SAIR</button>
    </aside>

    <main class="container-gerenciar">

        <div class="header-gerenciar">
            <div class="titulos">
                <h1 class="titulo-boas-vindas">Gerenciar Cargos</h1>
                <span class="subtitulo">*Gerenciar cargos e suas permissões</span>
            </div>
            <button class="btn-novo-usuario" onclick="abrirModal()">+ Novo Cargo</button>
        </div>

        <nav class="gestao-nav" aria-label="Navegação da gestão">
            <a href="usuarios.html">Gerenciar Organização</a>
            <a class="ativo" href="cargos.html" aria-current="page">Gerenciar Cargos</a>
            <a href="permissoes.html">Gerenciar Permissões</a>
        </nav>

        <div class="cartao-gerenciar">

            <div class="tabela-cabecalho">
                <div class="col-nome">Cargo</div>
                <div class="col-email">Permissões</div>
                <div class="col-acoes">Ações</div>
            </div>

            <div id="listaCargos">
                <!--vazio aqui pq preenche com o js-->
            </div>

        </div>
    </main>
</div>

<script>

    document.getElementById("nome-usuario").textContent = sessionStorage.NOME_USUARIO || "Usuário";
    if (Number(sessionStorage.CARGO_USUARIO) <= 2) {
        document.getElementById("nav-configurar-gestao").style.display = "";
    }

    const btnMenu = document.getElementById("btn-menu");
    const overlay = document.getElementById("overlay");
    btnMenu.addEventListener("click", () => document.body.classList.toggle("menu-fechado"));
    overlay.addEventListener("click", () => document.body.classList.add("menu-fechado"));

    let idCompanhia = Number(sessionStorage.COMPANHIA_USUARIO);
    let permissoesEscolhidas = [];

    function abrirModal() {
        document.getElementById("modalCadastro").style.display = "flex";
        carregarPermissoesDoSelect();
    }

    function fecharModal() {
        document.getElementById("modalCadastro").style.display = "none";
        document.getElementById("modalNomeCargo").value = "";
        document.getElementById("modalCargo").value = "";
        permissoesEscolhidas = [];
        atualizarTelaDePermissoes();
    }

    function listarCargos() {
        fetch(`/cargos/listar/${idCompanhia}`)
            .then(res => res.json())
            .then(linhasBd => {
                let lista = document.getElementById("listaCargos");
                lista.innerHTML = "";

                let cargosAgrupados = [];
                let ultimoIdVisto = -1;
                let indexAtual = -1;

                for (let i = 0; i < linhasBd.length; i++) {
                    let linha = linhasBd[i];

                    if (linha.idCargo !== ultimoIdVisto) {
                        indexAtual++;
                        cargosAgrupados[indexAtual] = {
                            idCargo: linha.idCargo,
                            cargo: linha.cargo,
                            permissoes: ""
                        };
                        ultimoIdVisto = linha.idCargo;
                    }

                    let estaMarcado = "";
                    if (linha.idCargoPermissao !== null) {
                        estaMarcado = "checked";
                    }

                    let permissaoBloco = `
                        <label class="permissao-checkbox-label">
                            <input type="checkbox" value="${linha.idPermissao}" class="checkbox-cargo-${linha.idCargo}" ${estaMarcado} style="margin-right: 5px;">
                            <span>${linha.permissao}</span>
                        </label>
                    `;

                    cargosAgrupados[indexAtual].permissoes += permissaoBloco;
                }

                for (let i = 0; i < cargosAgrupados.length; i++) {
                    let c = cargosAgrupados[i];

                    let textoPermissoes = c.permissoes;
                    if (textoPermissoes === "") {
                        textoPermissoes = "Nenhuma permissão vinculada";
                    }

                    lista.innerHTML += `
                        <div class="linha-usuario" id="linha_cargo_${c.idCargo}">
                            <div class="col-nome texto-nome-cargo">
                                ${c.cargo}
                            </div>
                            <div class="col-email texto-permissoes-cargo">
                                ${textoPermissoes}
                            </div>
                            <div class="col-acoes acoes-botoes">
                                <button class="btn-acao" onclick="atualizarCargo(${c.idCargo})">Alterar</button>
                                <button class="btn-acao" onclick="excluirCargo(${c.idCargo})">Excluir</button>
                            </div>
                        </div>
                    `;
                }
            })
            .catch(erro => {
                console.error("Erro ao carregar cargos:", erro);
            });
    }

    function carregarPermissoesDoSelect() {
        fetch("/cargos/permissoes")
            .then(res => res.json())
            .then(permissoes => {
                let select = document.getElementById("modalCargo");
                select.innerHTML = '<option value="">Selecione uma permissão...</option>';

                for(let i = 0; i < permissoes.length; i++) {
                    select.innerHTML += `<option value="${permissoes[i].idPermissao}">${permissoes[i].nome}</option>`;
                }
            });
    }

    function adicionarPermissaoNaLista() {
        let select = document.getElementById("modalCargo");
        let idPerm = select.value;
        let nomePerm = select.options[select.selectedIndex].text;

        if (idPerm === "") return;

        let jaExiste = false;
        for(let i = 0; i < permissoesEscolhidas.length; i++) {
            if(permissoesEscolhidas[i].id === idPerm) jaExiste = true;
        }

        if(!jaExiste) {
            permissoesEscolhidas.push({ id: idPerm, nome: nomePerm });
            atualizarTelaDePermissoes();
        }
    }

    function atualizarTelaDePermissoes() {
        let div = document.getElementById("listaPermissoesModal");
        div.innerHTML = "";

        for(let i = 0; i < permissoesEscolhidas.length; i++) {
            let p = permissoesEscolhidas[i];
            div.innerHTML += `
                <div class="tag-permissao">
                    ${p.nome}
                    <span class="tag-remover-btn" onclick="removerPermissaoDaLista('${p.id}')">X</span>
                </div>
            `;
        }
    }

    function removerPermissaoDaLista(idRemover) {
        let novaLista = [];
        for(let i = 0; i < permissoesEscolhidas.length; i++) {
            if(permissoesEscolhidas[i].id !== idRemover) {
                novaLista.push(permissoesEscolhidas[i]);
            }
        }
        permissoesEscolhidas = novaLista;
        atualizarTelaDePermissoes();
    }

    function criarNovoCargo() {
        let nomeCargo = document.getElementById("modalNomeCargo").value;

        if (nomeCargo === "") {
            alert("Digite o nome do cargo!");
            return;
        }

        let idsParaEnviar = [];
        for(let i = 0; i < permissoesEscolhidas.length; i++) {
            idsParaEnviar.push(permissoesEscolhidas[i].id);
        }

        fetch("/cargos/cadastrar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nomeCargoServer: nomeCargo,
                idCompanhiaServer: idCompanhia,
                permissoesServer: idsParaEnviar
            })
        }).then(res => {
            if(res.ok) {
                alert("Cargo cadastrado com sucesso!");
                fecharModal();
                listarCargos();
            }
        });
    }

    function excluirCargo(idCargo) {
        if(confirm("Atenção! Tem certeza que deseja excluir este cargo?")) {
            fetch(`/cargos/deletar/${idCargo}`, {
                method: "DELETE"
            }).then(res => {
                if(res.ok) {
                    alert("Cargo excluído com sucesso!");
                    listarCargos();
                } else {
                    alert("Erro ao excluir cargo. Verifique se existem usuários vinculados a ele.");
                }
            }).catch(erro => {
                console.error("Erro na exclusão:", erro);
            });
        }
    }

    function atualizarCargo(idCargo) {
        if (confirm("Deseja confirmar a alteração das permissões deste cargo?")) {

            let checkboxes = document.querySelectorAll(`.checkbox-cargo-${idCargo}:checked`);
            let permissoesSelecionadas = [];

            for (let i = 0; i < checkboxes.length; i++) {
                permissoesSelecionadas.push(checkboxes[i].value);
            }

            fetch(`/cargos/atualizar/${idCargo}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    permissoesServer: permissoesSelecionadas
                })
            }).then(res => {
                if (res.ok) {
                    alert("Permissões atualizadas com sucesso!");
                    listarCargos();
                } else {
                    alert("Erro ao atualizar permissões.");
                }
            });
        }
    }
        listarCargos();

</script>

</body>
</html>
