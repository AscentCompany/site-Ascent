<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascent | Gerenciar Cargos</title>
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/cruds.css">

</head>
<body>
<div class="modal-overlay" id="modalCadastro" style="display: none;">
    <div class="modal-content formulario">
        <span class="fechar-modal" onclick="fecharModal()">X</span>
        <h2 class="titulo-boas-vindas" style="font-size: 24px;">Novo Cargo</h2>

        <label for="modalNomeCargo">Nome do Cargo</label>
        <input type="text" id="modalNomeCargo" placeholder="Nome do Cargo">

        <label for="modalCargo">Permissões</label>
        <div class="modal-input-group">
            <select id="modalCargo" class="modal-select-flex">
                <option value="">Selecione uma permissão...</option>
            </select>
            <button class="btn-acao" onclick="adicionarPermissaoNaLista()" style="height: auto;">Add</button>
        </div>

        <div id="listaPermissoesModal" class="modal-tags-container">
            <!-- preenchido pelo js -->
        </div>

        <button class="botao-enviar" onclick="criarNovoCargo()" style="margin-top: 25px;">Criar Cargo</button>
    </div>
</div>


<div class="page-wrapper">

    <div class="sidebar">
        <div class="logo-container">
            <a href="index.html">
                <img src="assets/icon/logo.png" alt="Logo da Ascent" />
            </a>
        </div>
        <nav class="sidebar-menu">
            <button class="menu-btn" onclick="window.location.href='usuarios.html'">Gerenciar Organização</button>
            <button class="menu-btn active" onclick="window.location.href='usuarios.html'">Gerenciar Cargos</button>
            <button class="menu-btn" onclick="window.location.href='usuarios.html'">Gerenciar Permissões</button>
        </nav>
    </div>

    <main class="container-gerenciar">

        <div class="header-gerenciar">
            <div class="titulos">
                <h1 class="titulo-boas-vindas">Gerenciar Cargos</h1>
                <span class="subtitulo">*Gerenciar cargos e suas permissões</span>
            </div>
            <button class="btn-novo-usuario" onclick="abrirModal()">+ Novo Cargo</button>
        </div>

        <div class="cartao-gerenciar">

            <div class="tabela-cabecalho">
                <div class="col-nome">Cargo</div>
                <div class="col-email">Permissões</div>
                <div class="col-acoes">Ações</div>
            </div>

            <div id="listaCargos">
                <!--vazio aqui pq preenche com o js-->
            </div>

        </div>
    </main>
</div>

<script>

    let idCompanhia = Number(sessionStorage.COMPANHIA_USUARIO);
    let permissoesEscolhidas = [];

    function abrirModal() {
        document.getElementById("modalCadastro").style.display = "flex";
        carregarPermissoesDoSelect();
    }

    function fecharModal() {
        document.getElementById("modalCadastro").style.display = "none";
        document.getElementById("modalNomeCargo").value = "";
        document.getElementById("modalCargo").value = "";
        permissoesEscolhidas = [];
        atualizarTelaDePermissoes();
    }

    function listarCargos() {
        fetch(`/cargos/cargos/${idCompanhia}`)
            .then(res => res.json())
            .then(linhasBd => {
                let lista = document.getElementById("listaCargos");
                lista.innerHTML = "";

                let cargosAgrupados = [];
                let ultimoIdVisto = -1;
                let indexAtual = -1;

                for (let i = 0; i < linhasBd.length; i++) {
                    let linha = linhasBd[i];

                    if (linha.idCargo !== ultimoIdVisto) {
                        indexAtual++;
                        cargosAgrupados[indexAtual] = {
                            idCargo: linha.idCargo,
                            cargo: linha.cargo,
                            permissoes: ""
                        };
                        ultimoIdVisto = linha.idCargo;
                    }

                    let estaMarcado = "";
                    if (linha.idCargoPermissao !== null) {
                        estaMarcado = "checked";
                    }

                    let permissaoBloco = `
                        <label class="permissao-checkbox-label">
                            <input type="checkbox" ${estaMarcado} style="margin-right: 5px;">
                            <span>${linha.permissao}</span>
                        </label>
                    `;

                    cargosAgrupados[indexAtual].permissoes += permissaoBloco;
                }

                for (let i = 0; i < cargosAgrupados.length; i++) {
                    let c = cargosAgrupados[i];

                    let textoPermissoes = c.permissoes;
                    if (textoPermissoes === "") {
                        textoPermissoes = "Nenhuma permissão vinculada";
                    }

                    lista.innerHTML += `
                        <div class="linha-usuario" id="linha_cargo_${c.idCargo}">
                            <div class="col-nome texto-nome-cargo">
                                ${c.cargo}
                            </div>
                            <div class="col-email texto-permissoes-cargo">
                                ${textoPermissoes}
                            </div>
                            <div class="col-acoes acoes-botoes">
                                <button class="btn-acao" onclick="abrirModalEdicao(${c.idCargo})">Editar</button>
                                <button class="btn-acao" onclick="excluirCargo(${c.idCargo})">Excluir</button>
                            </div>
                        </div>
                    `;
                }
            })
            .catch(erro => {
                console.error("Erro ao carregar cargos:", erro);
            });
    }

    function carregarPermissoesDoSelect() {
        fetch("/cargos/permissoes")
            .then(res => res.json())
            .then(permissoes => {
                let select = document.getElementById("modalCargo");
                select.innerHTML = '<option value="">Selecione uma permissão...</option>';

                for(let i = 0; i < permissoes.length; i++) {
                    select.innerHTML += `<option value="${permissoes[i].idPermissao}">${permissoes[i].nome}</option>`;
                }
            });
    }

    function adicionarPermissaoNaLista() {
        let select = document.getElementById("modalCargo");
        let idPerm = select.value;
        let nomePerm = select.options[select.selectedIndex].text;

        if (idPerm === "") return;

        let jaExiste = false;
        for(let i = 0; i < permissoesEscolhidas.length; i++) {
            if(permissoesEscolhidas[i].id === idPerm) jaExiste = true;
        }

        if(!jaExiste) {
            permissoesEscolhidas.push({ id: idPerm, nome: nomePerm });
            atualizarTelaDePermissoes();
        }
    }

    function atualizarTelaDePermissoes() {
        let div = document.getElementById("listaPermissoesModal");
        div.innerHTML = "";

        for(let i = 0; i < permissoesEscolhidas.length; i++) {
            let p = permissoesEscolhidas[i];
            div.innerHTML += `
                <div class="tag-permissao">
                    ${p.nome}
                    <span class="tag-remover-btn" onclick="removerPermissaoDaLista('${p.id}')">X</span>
                </div>
            `;
        }
    }

    function removerPermissaoDaLista(idRemover) {
        let novaLista = [];
        for(let i = 0; i < permissoesEscolhidas.length; i++) {
            if(permissoesEscolhidas[i].id !== idRemover) {
                novaLista.push(permissoesEscolhidas[i]);
            }
        }
        permissoesEscolhidas = novaLista;
        atualizarTelaDePermissoes();
    }

    function criarNovoCargo() {
        let nomeCargo = document.getElementById("modalNomeCargo").value;

        if (nomeCargo === "") {
            alert("Digite o nome do cargo!");
            return;
        }

        let idsParaEnviar = [];
        for(let i = 0; i < permissoesEscolhidas.length; i++) {
            idsParaEnviar.push(permissoesEscolhidas[i].id);
        }

        fetch("/cargos/cadastrar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nomeCargoServer: nomeCargo,
                idCompanhiaServer: idCompanhia,
                permissoesServer: idsParaEnviar
            })
        }).then(res => {
            if(res.ok) {
                alert("Cargo cadastrado com sucesso!");
                fecharModal();
                listarCargos();
            }
        });
    }
        listarCargos();

</script>

</body>
</html>
