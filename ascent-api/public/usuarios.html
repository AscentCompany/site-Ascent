<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascent | Gerenciar Organização</title>
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/cruds.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lilita+One&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
    <link rel="stylesheet" href="css/dashboardOperacoes.css">

</head>
<body>
    <script src="js/sessao.js"></script>
    <script>validarSessao();</script>

<div class="modal-overlay" id="modalCadastro">
    <div class="modal-content formulario">
        <span class="fechar-modal" onclick="fecharModal()">X</span>
        <h2 class="titulo-boas-vindas" style="font-size: 24px;">Novo Usuário</h2>

        <label for="modalNome">Nome</label>
        <input type="text" id="modalNome" placeholder="Nome do funcionário">

        <label for="modalEmail">E-mail</label>
        <input type="email" id="modalEmail" placeholder="email@empresa.com">

        <label for="modalSenha">Senha</label>
        <input type="password" id="modalSenha" placeholder="Senha temporária">

        <label for="modalCargo">Cargo</label>
        <select id="modalCargo">
        </select>

        <button class="botao-enviar" onclick="cadastrarNovoUsuario()">Cadastrar Funcionário</button>
    </div>
</div>

<div class="app">
    <button class="btn-menu" id="btn-menu" aria-label="Abrir ou fechar menu">
        <i class="fi fi-rr-menu-burger"></i>
    </button>
    <div class="overlay" id="overlay"></div>
    <aside class="sidebar">
        <div class="logo">
            <a href="dashboard/acessoRapido.html"><img src="assets/icon/logo2.png" alt="Ascent"></a>
        </div>
        <div class="profile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
            <span id="nome-usuario"></span>
        </div>
        <nav class="nav">
            <span class="nav-indicador" id="nav-indicador"></span>
            <div class="nav-item"><a href="dashboard/dashboardRotas.html">Dashboard - rotas</a></div>
            <div class="nav-item"><a href="dashboard/dashboardOperacoes.html">Dashboard - operações</a></div>
            <div class="nav-item ativo"><a href="usuarios.html">Gestão</a></div>
            <div class="nav-item"><a href="dashboard/centralAlertas.html">Central de Alertas</a></div>
            <div class="nav-item" id="nav-configurar-gestao" style="display:none;"><a href="dashboard/configurarAlertas.html">Configurar Alertas</a></div>
            <div class="nav-item"><a href="dashboard/perfil.html">Perfil</a></div>
            <div class="nav-item"><a href="dashboard/faq.html">FAQ</a></div>
        </nav>
        <button class="logout" type="button" onclick="limparSessao()">SAIR</button>
    </aside>

    <main class="container-gerenciar">

        <nav class="gestao-nav" aria-label="Navegação da gestão">
            <a class="ativo" href="usuarios.html" aria-current="page">Gerenciar Organização</a>
            <a href="cargos.html">Gerenciar Cargos</a>
            <a href="permissoes.html">Gerenciar Permissões</a>
        </nav>

        <div class="header-gerenciar">
            <div class="titulos">
                <h1 class="titulo-boas-vindas">Gerenciar Funcionários</h1>
                <span class="subtitulo">*Gerenciar atributos da conta e cargos</span>
            </div>
            <button class="btn-novo-usuario" onclick="abrirModal()">+ Novo Usuário</button>
        </div>

        <div class="cartao-gerenciar">

            <div class="tabela-cabecalho">
                <div class="col-nome">Nome</div>
                <div class="col-email">Email</div>
                <div class="col-cargo">Cargo</div>
                <div class="col-acoes">Ações</div>
            </div>

            <div id="listaUsuarios">
                <!--vazio aqui pq preenche com o js-->
            </div>

        </div>
    </main>
</div>


<script>
    document.getElementById("nome-usuario").textContent = sessionStorage.NOME_USUARIO || "Usuário";
    if (Number(sessionStorage.CARGO_USUARIO) <= 2) {
        document.getElementById("nav-configurar-gestao").style.display = "";
    }

    const btnMenu = document.getElementById("btn-menu");
    const overlay = document.getElementById("overlay");
    if (window.innerWidth <= 900) document.body.classList.add("menu-fechado");
    btnMenu.addEventListener("click", () => document.body.classList.toggle("menu-fechado"));
    overlay.addEventListener("click", () => document.body.classList.add("menu-fechado"));

    const itensNav = [...document.querySelectorAll(".sidebar .nav-item")];
    const indicador = document.getElementById("nav-indicador");
    function posicionarIndicador() {
        const ativo = itensNav.find(item => item.classList.contains("ativo"));
        if (!ativo) return;
        indicador.style.transform = `translateY(${ativo.offsetTop}px)`;
        indicador.style.opacity = 1;
    }
    window.addEventListener("load", posicionarIndicador);
    window.addEventListener("resize", posicionarIndicador);

    let idUsuarioLogado = Number(sessionStorage.ID_USUARIO);
    let idCompanhia = Number(sessionStorage.COMPANHIA_USUARIO);
    let idCargoUsuarioLogado = Number(sessionStorage.CARGO_USUARIO);
    let cargosGlobais = [];

    function verificarPermissao() {
        if (!idCompanhia || !idCargoUsuarioLogado) {
            console.warn("Usuário não está logado ou os dados do sessionStorage estão vazios.");
            return;
        }

        fetch(`/usuarios/permissao/${idCompanhia}`)
            .then(res => res.json())
            .then(res => {
                let menorCargo = res[0].adminCargo;
                if(idCargoUsuarioLogado > menorCargo) {
                    alert("Você não tem permissão para acessar esta tela.");
                    window.location.href = "index.html";
                } else {
                    carregarCargos();
                }
            });
    }

    function carregarCargos() {
        fetch(`/usuarios/cargos/${idCompanhia}`)
            .then(res => res.json())
            .then(cargos => {
                cargosGlobais = cargos;

                let modalSelect = document.getElementById("modalCargo");

                let opcoesHtml = "";
                for (let i = 0; i < cargos.length; i++) {
                    let c = cargos[i];
                    opcoesHtml += `<option value="${c.idCargo}">${c.cargo}</option>`;
                }
                modalSelect.innerHTML = opcoesHtml;

                listarUsuarios();
            });
    }

    function listarUsuarios() {
        fetch(`/usuarios/listar/${idCompanhia}`)
            .then(res => res.json())
            .then(usuarios => {
                let lista = document.getElementById("listaUsuarios");
                lista.innerHTML = "";

                for (let i = 0; i < usuarios.length; i++) {
                    let u = usuarios[i];

                    let opcoesCargos = "";
                    for (let j = 0; j < cargosGlobais.length; j++) {
                        let c = cargosGlobais[j];
                        let selecionado = "";

                        if (c.idCargo === u.idCargo) {
                            selecionado = "selected";
                        }

                        opcoesCargos += `<option value="${c.idCargo}" ${selecionado}>${c.cargo}</option>`;
                    }

                    lista.innerHTML += `
                        <div class="linha-usuario" id="linha_${u.idUsuario}">
                          <div class="col-nome" style="color: var(--cinza-texto); font-weight: 600;">${u.nome}</div>
                          <div class="col-email"><input type="email" id="email_${u.idUsuario}" value="${u.email}"></div>
                          <div class="col-cargo"><select id="cargo_${u.idUsuario}">${opcoesCargos}</select></div>
                          <div class="col-acoes acoes-botoes">
                            <button class="btn-acao" onclick="editarUsuario(${u.idUsuario})">Editar</button>
                            <button class="btn-acao" onclick="excluirUsuario(${u.idUsuario})">Excluir</button>
                          </div>
                        </div>
                    `;
                }
            });
    }

    function editarUsuario(idUsuario) {
        if(confirm("Tem certeza que deseja atualizar os dados deste usuário?")) {
            let novoEmail = document.getElementById(`email_${idUsuario}`).value;
            let novoCargo = document.getElementById(`cargo_${idUsuario}`).value;

            fetch(`/usuarios/editar/${idUsuario}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    email: novoEmail, 
                    fkCargo: novoCargo,
                    fkUsuarioAcao: idUsuarioLogado
                })
            }).then(res => {
                if(res.ok) {
                    alert("Usuário atualizado com sucesso!");
                    listarUsuarios();
                } else {
                    alert("Erro ao atualizar usuário.");
                }
            }).catch(err => {
                console.error("Erro na requisição:", err);
                alert("Erro ao conectar ao servidor.");
            });
        }
    }

    function excluirUsuario(idUsuario) {
        if(confirm("Atenção! Deseja realmente excluir este usuário da organização?")) {
            fetch(`/usuarios/deletar/${idUsuario}?fkUsuarioAcao=${idUsuarioLogado}`, {
                method: "DELETE"
            }).then(res => {
                if(res.ok) {
                    alert("Usuário excluído.");
                    listarUsuarios();
                } else {
                    alert("Erro ao excluir usuário.");
                }
            }).catch(err => {
                console.error("Erro na requisição:", err);
                alert("Erro ao conectar ao servidor.");
            });
        }
    }

    function cadastrarNovoUsuario() {
        let nomeVar = modalNome.value;
        let emailVar = modalEmail.value;
        let senhaVar = modalSenha.value;
        let cargoVar = modalCargo.value;

        if(!nomeVar || !emailVar || !senhaVar || !cargoVar) {
            alert("Preencha todos os campos do modal!");
            return;
        }

        fetch("/usuarios/cadastrarFuncionario", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nomeServer: nomeVar,
                emailServer: emailVar,
                senhaServer: senhaVar,
                idCompanhiaServer: idCompanhia,
                idCargoServer: cargoVar,
                fkUsuarioAcao: idUsuarioLogado
            })
        }).then(res => {
            if(res.ok) {
                alert("Funcionário cadastrado com sucesso!");
                fecharModal();
                listarUsuarios();
            } else {
                alert("Erro ao cadastrar funcionário.");
            }
        }).catch(err => {
            console.error("Erro na requisição:", err);
            alert("Erro ao conectar ao servidor.");
        });
    }

    function abrirModal() {
        document.getElementById("modalCadastro").style.display = "flex";
    }

    function fecharModal() {
        document.getElementById("modalCadastro").style.display = "none";
        modalNome.value = "";
        modalEmail.value = "";
        modalSenha.value = "";
    }

    verificarPermissao();

</script>

</body>
</html>
