services:
  mysql:
    image: mysql:8.0
    container_name: ascent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /dados/mysql:/var/lib/mysql
      - ./database/ascent.sql:/docker-entrypoint-initdb.d/01-ascent.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - ascent

  ascent-api:
    image: lucasveneroso/ascent:ascent-api
    container_name: ascent-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: ${APP_PORT:-3333}
      AMBIENTE_PROCESSO: producao
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${APP_PORT:-3333}:${APP_PORT:-3333}"
    networks:
      - ascent

networks:
  ascent:
    driver: bridge
