# =============================================================
# docker-compose.yml — Ascent (produção / AWS EC2)
#
# Como usar:
#   1. Copie .env.example para .env e preencha os valores reais
#   2. docker compose up -d
#
# Serviços:
#   mysql            → banco de dados (apenas rede interna)
#   ascent-api       → Node.js API + frontend (porta 3333)
#   ascent-logs      → notificador Java (porta 8080)
#   ascent-apachepoi → leitor S3 ANAC (porta 8081)
# =============================================================

services:

  mysql:
    image: mysql:8.0
    container_name: ascent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/ascent.sql:/docker-entrypoint-initdb.d/01-ascent.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - ascent

  ascent-api:
    image: lucasveneroso/ascent:ascent-api
    container_name: ascent-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: ${APP_PORT:-3333}
      AMBIENTE_PROCESSO: producao
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${APP_PORT:-3333}:${APP_PORT:-3333}"
    networks:
      - ascent

  ascent-logs:
    image: lucasveneroso/ascent:ascent-logs
    container_name: ascent-logs
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      SLACK_WEBHOOK_CADASTRO_URL: ${SLACK_WEBHOOK_CADASTRO_URL}
      EMAIL_REMETENTE: ${EMAIL_REMETENTE}
      SENHA_APP: ${SENHA_APP}
    ports:
      - "8080:8080"
    networks:
      - ascent

  ascent-apachepoi:
    image: lucasveneroso/ascent:ascent-apachepoi
    container_name: ascent-apachepoi
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_BUCKET: ${AWS_BUCKET}
      AWS_PREFIXO_ARQUIVOS: ${AWS_PREFIXO_ARQUIVOS:-anac_part_}
      AWS_TOTAL_PARTES: ${AWS_TOTAL_PARTES:-23}
      AWS_ARQUIVO_ANAC: ${AWS_ARQUIVO_ANAC}
      AUTO_IMPORT: ${AUTO_IMPORT:-true}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    ports:
      - "8081:8080"
    networks:
      - ascent

networks:
  ascent:
    driver: bridge

volumes:
  mysql_data:
    driver: local
