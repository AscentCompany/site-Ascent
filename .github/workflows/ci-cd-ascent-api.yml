name: CI/CD ascent-api

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ascent-api/**'

# Permissões necessárias para:
#   - contents: write   → fazer o merge do PR
#   - pull-requests: write → aprovar/fechar o PR via API
# Sem essas permissões o automerge retorna 403 e o CD falha.
permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: github.head_ref == 'develop'

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar dependências
        working-directory: ./ascent-api
        run: npm install

      - name: Construir imagem Docker
        working-directory: ./ascent-api
        run: docker build -t ascent-api .

      - name: Verificar se a imagem foi criada
        run: docker images | grep ascent-api

      - name: Salvar imagem para o próximo job
        run: docker save ascent-api -o ascent-api.tar

      - name: Fazer upload da imagem
        uses: actions/upload-artifact@v4
        with:
          name: ascent-api-image
          path: ascent-api.tar

  cd:
    name: Publicar no Docker Hub
    runs-on: ubuntu-latest
    needs: ci
    if: github.head_ref == 'develop'

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Verificar se o PR tem conflitos de merge
        run: |
          MERGEABLE=$(gh pr view ${{ github.event.pull_request.number }} --json mergeable --jq '.mergeable')
          echo "Estado de mergeabilidade: $MERGEABLE"
          if [ "$MERGEABLE" = "CONFLICTING" ]; then
            echo "::error::O PR tem conflitos de merge. Resolva antes de continuar."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Baixar imagem do CI
        uses: actions/download-artifact@v4
        with:
          name: ascent-api-image

      - name: Carregar imagem Docker
        run: docker load -i ascent-api.tar

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar imagem no Docker Hub
        run: |
          docker tag ascent-api lucasveneroso/ascent:ascent-api
          docker push lucasveneroso/ascent:ascent-api

      - name: Aceitar o Pull Request
        uses: pascalgn/automerge-action@v0.16.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_METHOD: squash
          MERGE_LABELS: ""
