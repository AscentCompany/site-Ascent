name: CI/CD ascent-apachepoi

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ascent-apachepoi/**'

jobs:
  ci:
    runs-on: ubuntu-latest
    if: github.head_ref == 'develop'

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compilar o projeto
        working-directory: ./ascent-apachepoi
        run: mvn clean package -DskipTests

      - name: Construir imagem Docker
        working-directory: ./ascent-apachepoi
        run: docker build -t ascent-apachepoi .

      - name: Subir container
        run: |
          docker run -d --name ascent-apachepoi \
            -e DB_HOST=localhost \
            -e DB_PORT=3306 \
            -e DB_DATABASE=ascent \
            -e DB_USER=admin \
            -e DB_PASSWORD=admin \
            ascent-apachepoi

      - name: Verificar se o container está rodando
        run: |
          sleep 10
          docker ps | grep ascent-apachepoi

  cd:
    runs-on: ubuntu-latest
    needs: ci
    if: github.head_ref == 'develop'

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compilar o projeto
        working-directory: ./ascent-apachepoi
        run: mvn clean package -DskipTests

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar imagem no Docker Hub
        working-directory: ./ascent-apachepoi
        run: |
          docker build -t lucasveneroso/ascent:ascent-apachepoi .
          docker push lucasveneroso/ascent:ascent-apachepoi

      - name: Aceitar o Pull Request
        uses: pascalgn/automerge-action@v0.16.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_METHOD: squash
