name: CI/CD ascent-logs

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ascent-logs/**'

jobs:
  ci:
    runs-on: ubuntu-latest
    if: github.head_ref == 'develop'

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compilar o projeto
        working-directory: ./ascent-logs
        run: mvn clean package -DskipTests

      - name: Construir imagem Docker
        working-directory: ./ascent-logs
        run: docker build -t ascent-logs .

      - name: Verificar se a imagem foi criada
        run: docker images | grep ascent-logs

      - name: Salvar imagem para o próximo job
        run: docker save ascent-logs -o ascent-logs.tar

      - name: Fazer upload da imagem
        uses: actions/upload-artifact@v4
        with:
          name: ascent-logs-image
          path: ascent-logs.tar

  cd:
    runs-on: ubuntu-latest
    needs: ci
    if: github.head_ref == 'develop'

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Baixar imagem do CI
        uses: actions/download-artifact@v4
        with:
          name: ascent-logs-image

      - name: Carregar imagem Docker
        run: docker load -i ascent-logs.tar

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar imagem no Docker Hub
        run: |
          docker tag ascent-logs lucasveneroso/ascent:ascent-logs
          docker push lucasveneroso/ascent:ascent-logs

      - name: Aceitar o Pull Request
        uses: pascalgn/automerge-action@v0.16.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_METHOD: squash
